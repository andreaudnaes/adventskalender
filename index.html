<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4B0F1E">
  <title>Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=202611101745">
</head>
<body>
  <main class="app">

    <!-- Teaser før 1. desember: hele skjermen er en innpakket gave -->
    <section id="teaser" class="screen teaser" hidden>
      <div class="ribbon ribbon-v" aria-hidden="true"></div>
      <div class="ribbon ribbon-h" aria-hidden="true"></div>
      <button type="button" class="bow" id="gift" aria-label="Gave som kan åpnes 1. desember">
        <svg viewBox="0 0 240 150" aria-hidden="true">
          <defs>
            <linearGradient id="tg-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F6DFA4"/>
              <stop offset=".45" stop-color="#D6AE68"/>
              <stop offset="1" stop-color="#A67C3A"/>
            </linearGradient>
            <linearGradient id="tg-gold-v" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#B98C45"/>
              <stop offset=".5" stop-color="#F3D99A"/>
              <stop offset="1" stop-color="#B98C45"/>
            </linearGradient>
          </defs>
          <!-- haler -->
          <path d="M112 70 L70 146 L84 140 L90 150 L128 78 Z" fill="url(#tg-gold)"/>
          <path d="M128 70 L170 146 L156 140 L150 150 L112 78 Z" fill="url(#tg-gold)"/>
          <!-- løkker -->
          <path d="M120 64 C 92 8, 14 10, 22 54 C 28 88, 84 84, 120 72 Z" fill="url(#tg-gold)"/>
          <path d="M120 64 C 148 8, 226 10, 218 54 C 212 88, 156 84, 120 72 Z" fill="url(#tg-gold)"/>
          <path d="M116 64 C 94 30, 46 30, 42 52 C 42 68, 84 72, 116 68 Z" fill="#A67C3A" opacity=".45"/>
          <path d="M124 64 C 146 30, 194 30, 198 52 C 198 68, 156 72, 124 68 Z" fill="#A67C3A" opacity=".45"/>
          <!-- glans -->
          <path d="M34 40 C 48 24, 74 22, 92 32" stroke="#FFF3D1" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>
          <path d="M148 32 C 166 22, 192 24, 206 40" stroke="#FFF3D1" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>
          <!-- knute -->
          <rect x="104" y="52" width="32" height="30" rx="9" fill="url(#tg-gold-v)"/>
        </svg>
      </button>
      <div class="tag">
        <p class="tag-text">Kan åpnes<br>1. desember</p>
      </div>
    </section>

    <!-- Forsiden -->
    <section id="home" class="screen home">
      <header class="hero">
        <p class="eyebrow">Desember · 2026</p>
        <h1 class="title">Adventskalender</h1>
        <div class="ornament" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.3l-5.8 4.6L18.2 21 12 17l-6.2 4 2-7.1L2 9.3l7.4-.4z"/></svg>
          <span></span>
        </div>
        <p class="subtitle">En ny gåte bak hver luke</p>
      </header>

      <div id="grid" class="grid"></div>

      <footer class="progress">
        <div class="progress-text">
          <span id="today-label"></span>
          <span id="progress-label" class="progress-count"></span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      </footer>

      <div id="toast" class="toast" role="status" hidden></div>
    </section>

    <!-- Spillsiden -->
    <section id="game" class="screen game" hidden>
      <div class="game-top">
        <button type="button" id="back" class="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          Tilbake til kalenderen
        </button>
        <button type="button" id="help-btn" class="help-btn" aria-label="Hvordan spiller man?" hidden>?</button>
      </div>
      <div class="game-head">
        <p id="game-date" class="eyebrow"></p>
        <p id="game-day" class="game-day"></p>
        <h2 id="game-name" class="game-name"></h2>
      </div>
      <div id="game-area" class="game-area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <p class="game-area-title">Dagens spill kommer her</p>
        <p class="game-area-text">Når gåten er løst, låses dagens belønning og en brikke til finalen opp.</p>
      </div>
    </section>

  </main>

  <!-- Forklaring av spillet -->
  <div id="help" class="help" hidden>
    <div class="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <button type="button" id="help-close" class="help-close" aria-label="Lukk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p class="eyebrow">Slik spiller du</p>
      <h3 id="help-title" class="help-title"></h3>
      <p id="help-intro" class="help-intro"></p>
      <ul id="help-list" class="help-list"></ul>
      <button type="button" id="help-ok" class="help-ok">Skjønner!</button>
    </div>
  </div>

  <script src="ord.js?v=202611101745"></script>
  <script src="wordle.js?v=202611101745"></script>
  <script src="nonogram.js?v=202611101745"></script>
  <script src="zip.js?v=202611101745"></script>
  <script src="pyralinks.js?v=202611101745"></script>
  <script src="connies.js?v=202611101745"></script>
  <script src="strands.js?v=202611101745"></script>
  <script src="pips.js?v=202611101745"></script>
  <script src="kryssord.js?v=202611101745"></script>
  <script src="app.js?v=202611101745"></script>
</body>
</html>
