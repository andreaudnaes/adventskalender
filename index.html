<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4B0F1E">
  <title>Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=202611101828">
</head>
<body>
  <main class="app">

    <!-- Teaser før 1. desember: hele skjermen er en innpakket gave -->
    <section id="teaser" class="screen teaser" hidden>
      <div class="ribbon ribbon-v" aria-hidden="true"></div>
      <div class="ribbon ribbon-h" aria-hidden="true"></div>
      <button type="button" class="bow" id="gift" aria-label="Gave som kan åpnes 1. desember">
        <svg viewBox="0 0 300 220" aria-hidden="true">
          <defs>
            <!-- metallisk satengull -->
            <linearGradient id="g-loop" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8A6528"/>
              <stop offset=".18" stop-color="#C99A4E"/>
              <stop offset=".34" stop-color="#F8E6B0"/>
              <stop offset=".46" stop-color="#E2BE76"/>
              <stop offset=".62" stop-color="#A97F38"/>
              <stop offset=".78" stop-color="#E9CB86"/>
              <stop offset="1" stop-color="#7A5822"/>
            </linearGradient>
            <linearGradient id="g-inner" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#5E4216"/>
              <stop offset=".5" stop-color="#8E6A2C"/>
              <stop offset="1" stop-color="#4A3311"/>
            </linearGradient>
            <linearGradient id="g-tail" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#7A5822"/>
              <stop offset=".25" stop-color="#D4AA5E"/>
              <stop offset=".45" stop-color="#FBEBB8"/>
              <stop offset=".6" stop-color="#D9B266"/>
              <stop offset="1" stop-color="#6E4F1D"/>
            </linearGradient>
            <linearGradient id="g-tail-d" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity=".35"/>
              <stop offset=".35" stop-color="#000" stop-opacity="0"/>
              <stop offset=".7" stop-color="#000" stop-opacity="0"/>
              <stop offset="1" stop-color="#000" stop-opacity=".25"/>
            </linearGradient>
            <linearGradient id="g-knot" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#6E4F1D"/>
              <stop offset=".2" stop-color="#C69A50"/>
              <stop offset=".45" stop-color="#FBEAB6"/>
              <stop offset=".62" stop-color="#DDB66C"/>
              <stop offset="1" stop-color="#5E4216"/>
            </linearGradient>
            <radialGradient id="g-sheen" cx=".35" cy=".3" r=".6">
              <stop offset="0" stop-color="#FFF8E1" stop-opacity=".75"/>
              <stop offset="1" stop-color="#FFF8E1" stop-opacity="0"/>
            </radialGradient>
            <filter id="f-soft" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="1.2"/>
            </filter>
            <filter id="f-shadow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="6"/>
            </filter>
            <g id="loop">
              <!-- løkke: ytterside -->
              <path d="M150 92 C 126 50, 70 18, 34 34 C 6 47, 10 92, 44 108 C 76 122, 120 112, 150 102 Z" fill="url(#g-loop)"/>
              <!-- innsiden av løkka (mørkere) -->
              <path d="M146 94 C 124 66, 82 46, 58 56 C 40 64, 44 88, 66 96 C 90 104, 124 100, 146 98 Z" fill="url(#g-inner)"/>
              <!-- kanten der båndet bretter seg inn -->
              <path d="M146 94 C 124 66, 82 46, 58 56 C 40 64, 44 88, 66 96" fill="none" stroke="#FCEFC4" stroke-opacity=".55" stroke-width="1.6"/>
              <!-- glans på ytterkanten -->
              <path d="M128 66 C 104 40, 66 28, 42 40" fill="none" stroke="#FFF7DC" stroke-width="5" stroke-linecap="round" opacity=".55" filter="url(#f-soft)"/>
              <path d="M36 98 C 58 114, 104 116, 140 106" fill="none" stroke="#5A3F14" stroke-width="3" stroke-linecap="round" opacity=".35" filter="url(#f-soft)"/>
              <!-- folder der båndet samles i knuten -->
              <path d="M150 92 C 144 90, 138 90, 132 92 L 150 102 Z" fill="#4A3311" opacity=".35"/>
            </g>
          </defs>
          <!-- skygge under sløyfa -->
          <ellipse cx="150" cy="118" rx="120" ry="44" fill="#000" opacity=".35" filter="url(#f-shadow)"/>
          <!-- haler -->
          <path d="M140 104 C 130 132, 112 160, 84 206 L 100 198 L 108 214 C 128 176, 146 140, 158 108 Z" fill="url(#g-tail)"/>
          <path d="M140 104 C 130 132, 112 160, 84 206 L 100 198 L 108 214 C 128 176, 146 140, 158 108 Z" fill="url(#g-tail-d)"/>
          <path d="M160 104 C 170 132, 188 160, 216 206 L 200 198 L 192 214 C 172 176, 154 140, 142 108 Z" fill="url(#g-tail)"/>
          <path d="M160 104 C 170 132, 188 160, 216 206 L 200 198 L 192 214 C 172 176, 154 140, 142 108 Z" fill="url(#g-tail-d)"/>
          <path d="M150 112 C 140 140, 124 170, 104 204" fill="none" stroke="#FFF5D6" stroke-width="2" opacity=".45" filter="url(#f-soft)"/>
          <path d="M156 112 C 168 140, 182 168, 198 198" fill="none" stroke="#FFF5D6" stroke-width="2" opacity=".35" filter="url(#f-soft)"/>
          <!-- løkker -->
          <use href="#loop"/>
          <use href="#loop" transform="translate(300 0) scale(-1 1)"/>
          <!-- knute -->
          <path d="M134 80 C 140 76, 160 76, 166 80 C 170 92, 170 104, 166 114 C 160 118, 140 118, 134 114 C 130 104, 130 92, 134 80 Z" fill="url(#g-knot)"/>
          <path d="M140 82 C 138 94, 138 104, 140 114" fill="none" stroke="#5A3F14" stroke-width="1.2" opacity=".45"/>
          <path d="M160 82 C 162 94, 162 104, 160 114" fill="none" stroke="#5A3F14" stroke-width="1.2" opacity=".45"/>
          <path d="M147 81 C 145 94, 145 104, 147 115" fill="none" stroke="#FFF6D8" stroke-width="2.4" opacity=".7" filter="url(#f-soft)"/>
        </svg>
      </button>
      <div class="tag">
        <p class="tag-text">Kan åpnes<br>1. desember</p>
      </div>
    </section>

    <!-- Forsiden -->
    <section id="home" class="screen home">
      <header class="hero">
        <p class="eyebrow">Desember · 2026</p>
        <h1 class="title">Adventskalender</h1>
        <div class="ornament" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.3l-5.8 4.6L18.2 21 12 17l-6.2 4 2-7.1L2 9.3l7.4-.4z"/></svg>
          <span></span>
        </div>
        <p class="subtitle">En ny gåte bak hver luke</p>
      </header>

      <div id="grid" class="grid"></div>

      <footer class="progress">
        <div class="progress-text">
          <span id="today-label"></span>
          <span id="progress-label" class="progress-count"></span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      </footer>

      <div id="toast" class="toast" role="status" hidden></div>
    </section>

    <!-- Spillsiden -->
    <section id="game" class="screen game" hidden>
      <div class="game-top">
        <button type="button" id="back" class="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          Tilbake til kalenderen
        </button>
        <button type="button" id="help-btn" class="help-btn" aria-label="Hvordan spiller man?" hidden>?</button>
      </div>
      <div class="game-head">
        <p id="game-date" class="eyebrow"></p>
        <p id="game-day" class="game-day"></p>
        <h2 id="game-name" class="game-name"></h2>
      </div>
      <div id="game-area" class="game-area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <p class="game-area-title">Dagens spill kommer her</p>
        <p class="game-area-text">Når gåten er løst, låses dagens belønning og en brikke til finalen opp.</p>
      </div>
    </section>

  </main>

  <!-- Forklaring av spillet -->
  <div id="help" class="help" hidden>
    <div class="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <button type="button" id="help-close" class="help-close" aria-label="Lukk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p class="eyebrow">Slik spiller du</p>
      <h3 id="help-title" class="help-title"></h3>
      <p id="help-intro" class="help-intro"></p>
      <ul id="help-list" class="help-list"></ul>
      <button type="button" id="help-ok" class="help-ok">Skjønner!</button>
    </div>
  </div>

  <script src="ord.js?v=202611101828"></script>
  <script src="wordle.js?v=202611101828"></script>
  <script src="nonogram.js?v=202611101828"></script>
  <script src="zip.js?v=202611101828"></script>
  <script src="pyralinks.js?v=202611101828"></script>
  <script src="connies.js?v=202611101828"></script>
  <script src="strands.js?v=202611101828"></script>
  <script src="pips.js?v=202611101828"></script>
  <script src="kryssord.js?v=202611101828"></script>
  <script src="app.js?v=202611101828"></script>
</body>
</html>
