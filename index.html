<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4B0F1E">
  <title>Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=202611101743">
</head>
<body>
  <main class="app">

    <!-- Teaser før 1. desember -->
    <section id="teaser" class="screen teaser" hidden>
      <button type="button" class="gift" id="gift" aria-label="En gave som kan åpnes 1. desember">
        <svg viewBox="0 0 240 260" aria-hidden="true">
          <defs>
            <linearGradient id="tg-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F3D99A"/>
              <stop offset=".45" stop-color="#D6AE68"/>
              <stop offset="1" stop-color="#A67C3A"/>
            </linearGradient>
            <linearGradient id="tg-gold-v" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#B98C45"/>
              <stop offset=".5" stop-color="#F0D28F"/>
              <stop offset="1" stop-color="#B98C45"/>
            </linearGradient>
            <linearGradient id="tg-box" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7A1A30"/>
              <stop offset="1" stop-color="#5A1123"/>
            </linearGradient>
            <linearGradient id="tg-lid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8C2039"/>
              <stop offset="1" stop-color="#6E1A2D"/>
            </linearGradient>
            <pattern id="tg-dots" width="16" height="16" patternUnits="userSpaceOnUse">
              <circle cx="4" cy="4" r="1.3" fill="#D6AE68" opacity=".28"/>
              <circle cx="12" cy="12" r="1.3" fill="#D6AE68" opacity=".28"/>
            </pattern>
          </defs>
          <!-- skygge -->
          <ellipse cx="120" cy="248" rx="96" ry="8" fill="#000" opacity=".25"/>
          <!-- eske -->
          <rect x="34" y="118" width="172" height="126" rx="6" fill="url(#tg-box)"/>
          <rect x="34" y="118" width="172" height="126" rx="6" fill="url(#tg-dots)"/>
          <!-- lokk -->
          <rect x="24" y="96" width="192" height="32" rx="6" fill="url(#tg-lid)"/>
          <rect x="24" y="96" width="192" height="32" rx="6" fill="url(#tg-dots)"/>
          <rect x="34" y="128" width="172" height="5" fill="#000" opacity=".18"/>
          <!-- bånd -->
          <rect x="108" y="96" width="24" height="148" fill="url(#tg-gold-v)"/>
          <rect x="34" y="166" width="172" height="20" fill="url(#tg-gold)"/>
          <rect x="108" y="166" width="24" height="20" fill="#F3D99A" opacity=".35"/>
          <!-- sløyfe: haler -->
          <path d="M116 92 L92 140 L102 136 L106 148 L124 98 Z" fill="url(#tg-gold)"/>
          <path d="M124 92 L148 140 L138 136 L134 148 L116 98 Z" fill="url(#tg-gold)"/>
          <!-- sløyfe: løkker -->
          <path d="M120 88 C 96 52, 50 56, 56 82 C 60 102, 96 100, 120 92 Z" fill="url(#tg-gold)"/>
          <path d="M120 88 C 144 52, 190 56, 184 82 C 180 102, 144 100, 120 92 Z" fill="url(#tg-gold)"/>
          <path d="M118 88 C 100 66, 72 66, 70 80 C 70 90, 96 92, 118 90 Z" fill="#A67C3A" opacity=".45"/>
          <path d="M122 88 C 140 66, 168 66, 170 80 C 170 90, 144 92, 122 90 Z" fill="#A67C3A" opacity=".45"/>
          <!-- knute -->
          <rect x="108" y="78" width="24" height="22" rx="7" fill="url(#tg-gold-v)"/>
          <!-- glans -->
          <path d="M64 70 C 74 62, 92 62, 104 72" stroke="#FFF3D1" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>
          <path d="M136 72 C 148 62, 166 62, 176 70" stroke="#FFF3D1" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>
        </svg>
      </button>
      <p class="eyebrow">Adventskalender · 2026</p>
      <h1 class="teaser-title">Kan åpnes<br>1. desember</h1>
      <div class="ornament" aria-hidden="true">
        <span></span>
        <svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.3l-5.8 4.6L18.2 21 12 17l-6.2 4 2-7.1L2 9.3l7.4-.4z"/></svg>
        <span></span>
      </div>
    </section>

    <!-- Forsiden -->
    <section id="home" class="screen home">
      <header class="hero">
        <p class="eyebrow">Desember · 2026</p>
        <h1 class="title">Adventskalender</h1>
        <div class="ornament" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.3l-5.8 4.6L18.2 21 12 17l-6.2 4 2-7.1L2 9.3l7.4-.4z"/></svg>
          <span></span>
        </div>
        <p class="subtitle">En ny gåte bak hver luke</p>
      </header>

      <div id="grid" class="grid"></div>

      <footer class="progress">
        <div class="progress-text">
          <span id="today-label"></span>
          <span id="progress-label" class="progress-count"></span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      </footer>

      <div id="toast" class="toast" role="status" hidden></div>
    </section>

    <!-- Spillsiden -->
    <section id="game" class="screen game" hidden>
      <div class="game-top">
        <button type="button" id="back" class="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          Tilbake til kalenderen
        </button>
        <button type="button" id="help-btn" class="help-btn" aria-label="Hvordan spiller man?" hidden>?</button>
      </div>
      <div class="game-head">
        <p id="game-date" class="eyebrow"></p>
        <p id="game-day" class="game-day"></p>
        <h2 id="game-name" class="game-name"></h2>
      </div>
      <div id="game-area" class="game-area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <p class="game-area-title">Dagens spill kommer her</p>
        <p class="game-area-text">Når gåten er løst, låses dagens belønning og en brikke til finalen opp.</p>
      </div>
    </section>

  </main>

  <!-- Forklaring av spillet -->
  <div id="help" class="help" hidden>
    <div class="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <button type="button" id="help-close" class="help-close" aria-label="Lukk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p class="eyebrow">Slik spiller du</p>
      <h3 id="help-title" class="help-title"></h3>
      <p id="help-intro" class="help-intro"></p>
      <ul id="help-list" class="help-list"></ul>
      <button type="button" id="help-ok" class="help-ok">Skjønner!</button>
    </div>
  </div>

  <script src="ord.js?v=202611101743"></script>
  <script src="wordle.js?v=202611101743"></script>
  <script src="nonogram.js?v=202611101743"></script>
  <script src="zip.js?v=202611101743"></script>
  <script src="pyralinks.js?v=202611101743"></script>
  <script src="connies.js?v=202611101743"></script>
  <script src="strands.js?v=202611101743"></script>
  <script src="pips.js?v=202611101743"></script>
  <script src="kryssord.js?v=202611101743"></script>
  <script src="app.js?v=202611101743"></script>
</body>
</html>
