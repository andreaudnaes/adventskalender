<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4B0F1E">

  <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Teaser før 1. desember: hele skjermen er en innpakket gave -->
    <section id="teaser" class="screen teaser" hidden>
      <div class="ribbon-wrap" aria-hidden="true"><div class="ribbons"></div></div>
      <button type="button" class="bow" id="gift" aria-label="Gave som kan åpnes 1. desember">

      <stop offset="1" stop-color="#5E4216"/>
    </linearGradient>
    <radialGradient id="tipg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="tailg" x1="0" y1="0" x2="1" y2="0">

      <stop offset=".8" stop-color="#3B2808" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2808" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="knotg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E4F1D"/><stop offset=".3" stop-color="#C69C52"/>
      <stop offset=".5" stop-color="#F3DA9C"/><stop offset=".7" stop-color="#C69C52"/>
      <stop offset="1" stop-color="#5E4216"/>
    </linearGradient>
  </defs>

      </button>
      <div class="tag">
        <p class="tag-text">Kan åpnes<br>1. desember</p>
      </div>
    </section>

    <!-- Forsiden -->
    <section id="home" class="screen home">
      <header class="hero">
        <p class="eyebrow">Desember · 2026</p>
        <h1 class="title">Adventskalender</h1>
        <div class="ornament" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.9L22 9.3l-5.8 4.6L18.2 21 12 17l-6.2 4 2-7.1L2 9.3l7.4-.4z"/></svg>
          <span></span>
        </div>
        <p class="subtitle">En ny gåte bak hver luke</p>
      </header>

      <div id="grid" class="grid"></div>

      <footer class="progress">
        <div class="progress-text">
          <span id="today-label"></span>
          <span id="progress-label" class="progress-count"></span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      </footer>

      <div id="toast" class="toast" role="status" hidden></div>
    </section>

    <!-- Spillsiden -->
    <section id="game" class="screen game" hidden>
      <div class="game-top">
        <button type="button" id="back" class="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          Tilbake til kalenderen
        </button>
        <button type="button" id="help-btn" class="help-btn" aria-label="Hvordan spiller man?" hidden>?</button>
      </div>
      <div class="game-head">
        <p id="game-date" class="eyebrow"></p>
        <p id="game-day" class="game-day"></p>
        <h2 id="game-name" class="game-name"></h2>
      </div>
      <div id="game-area" class="game-area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <p class="game-area-title">Dagens spill kommer her</p>
        <p class="game-area-text">Når gåten er løst, låses dagens belønning og en brikke til finalen opp.</p>
      </div>
    </section>

  </main>

  <!-- Forklaring av spillet -->
  <div id="help" class="help" hidden>
    <div class="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <button type="button" id="help-close" class="help-close" aria-label="Lukk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p class="eyebrow">Slik spiller du</p>
      <h3 id="help-title" class="help-title"></h3>
      <p id="help-intro" class="help-intro"></p>
      <ul id="help-list" class="help-list"></ul>
      <button type="button" id="help-ok" class="help-ok">Skjønner!</button>
    </div>
  </div>

  <script src="ord.js?v=202611101921"></script>
  <script src="wordle.js?v=202611101921"></script>
  <script src="nonogram.js?v=202611101921"></script>
  <script src="zip.js?v=202611101921"></script>
  <script src="pyralinks.js?v=202611101921"></script>
  <script src="connies.js?v=202611101921"></script>
  <script src="strands.js?v=202611101921"></script>
  <script src="pips.js?v=202611101921"></script>
  <script src="kryssord.js?v=202611101921"></script>
  <script src="app.js?v=202611101921"></script>
</body>
</html>
